version: '3.9'

# =============================================================================
# Restaurant OS — Docker Compose (Development)
# =============================================================================
# Run: docker compose up -d
# Starts: PostgreSQL, Redis, MinIO
# API and Web run on host for hot-reload development
# =============================================================================

services:
  # ─────────────────────────────────────────────
  # PostgreSQL 16
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: restaurant_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_os
      POSTGRES_USER: restaurantuser
      POSTGRES_PASSWORD: restaurantpassword
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U restaurantuser -d restaurant_os']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: restaurant_os_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # MinIO (S3-compatible local storage)
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: restaurant_os_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # MinIO Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  # ─────────────────────────────────────────────
  # MinIO bucket initialization
  # ─────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: restaurant_os_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb --ignore-existing myminio/menu-images;
      mc mb --ignore-existing myminio/files;
      mc anonymous set download myminio/menu-images;
      echo 'MinIO buckets initialized';
      exit 0;
      "
    restart: on-failure

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
